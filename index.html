<!doctype html>
<html lang="th" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>IG Follow Analyzer: เครื่องมือวิเคราะห์ผู้ติดตาม Instagram จากไฟล์ ZIP</title>
    <meta
      name="description"
      content="อัปโหลดข้อมูลจาก Instagram แล้วดูทันทีว่าใครไม่ติดตามคุณกลับ ใครที่คุณไม่ได้ติดตามกลับ และสรุปสถานะผู้ติดตามของคุณในเบราว์เซอร์โดยไม่ต้องกรอกรหัสผ่าน"
    />
    <link rel="canonical" href="https://follow-analyzer.tawandev.site/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://follow-analyzer.tawandev.site/" />
    <meta
      property="og:title"
      content="IG Follow Analyzer: เครื่องมือวิเคราะห์ผู้ติดตาม Instagram จากไฟล์ ZIP"
    />
    <meta
      property="og:description"
      content="เช็กผู้ติดตาม Instagram จากไฟล์ ZIP บนเครื่องของคุณ ไม่ต้องเข้าสู่ระบบ ไม่ขอรหัสผ่าน พร้อมรายงาน PDF (ไทย/อังกฤษ)"
    />
    <meta property="og:image" content="https://follow-analyzer.tawandev.site/share.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://follow-analyzer.tawandev.site/share.jpg" />
    <link rel="icon" href="%BASE_URL%favicon.svg?v=2" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="IG Analyzer" />
    <meta name="theme-color" content="#13141a" />
    <meta name="site-kind" content="software" />
    <meta name="page-type" content="software" />
    <script>
      (function () {
        try {
          var preference = localStorage.getItem('ig-follow-analyzer-theme') || 'system';
          var isLight =
            preference === 'light' ||
            (preference === 'system' &&
              window.matchMedia &&
              !window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (!isLight) return;
          document.documentElement.dataset.theme = 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#f8f8f5');
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
